stage_id: InferenceParakeetStage
category: transcribe
summary: "Parakeet ASR wrapper for resident audio, with language allowlisting and optional TensorRT encoder inference."
tags: [needs_gpu, needs_internet_first_run, batch_only]
model_id: "nvidia/parakeet-tdt-0.6b-v3"
domain: {language: "the configured supported_langs allowlist; 25 European codes by default", style: speech}
resource: {bound: gpu}
use_cases:
  good_for: ["transcribing resident waveform rows carrying a source_lang code"]
  avoid_for: ["file-only manifests without a waveform preparation stage", "word-level alignment"]
params_of_note:
  backend: "nemo (default), or tensorrt with an existing tensorrt_engine_dir; changing backend needs the matching optional runtime."
  supported_langs: "Non-empty override of the default checkpoint language-code allowlist. Missing or unsupported source_lang produces an empty prediction and routing notes."
  max_audio_sec_per_actor: "Padded audio-seconds budget per adapter call, default 2400; max_inference_duration_s must not exceed it."
  keep_waveform: "False removes waveform after inference; enable it for a downstream audio consumer."
notes:
  - "Defaults read waveform and sampling_rate and write asr_prediction and asr_language. Match downstream keys explicitly; ASRStage uses pred_text by default."
  - "Uses the shared ASRStage bounded batching and segment stitching. Its budget is a packing proxy, not a GPU-memory guarantee."
  - "TensorRT engines must already exist; the stage does not build them. The conservative inherited discovery gate still reports first-run internet access."
  - "Device support depends on backend: NeMo accepts CPU execution, while TensorRT requires one GPU. No stage-wide CPU fallback is claimed by this card."
verified: {params: mechanical, tags: mechanical, domain: mechanical, resource: best_guess, use_cases: best_guess}
provenance: {model_card_url: null, card_version: 1, last_validated: "2026-10-06"}
