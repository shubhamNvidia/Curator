  backend: "nemo (default), or tensorrt with an existing tensorrt_engine_dir. TensorRT replaces the encoder; preprocessing and decoding remain in NeMo."
  max_audio_sec_per_actor: "Padded audio-seconds budget per adapter call, default 2400; choose a compatible max_inference_duration_s."
  keep_waveform: "False removes waveform after inference; enable it for a downstream audio consumer."
notes:
  - "Defaults read waveform and sampling_rate and write asr_prediction and asr_language. Match downstream keys explicitly."
  - "Missing or unsupported source_lang emits an empty prediction and routing notes; the wrapper does not mark _skipme for unsupported languages."
  - "Uses the shared ASRStage duration ceiling and bounded batching. Hard-cut segment stitching cannot preserve speech context across a boundary."
  - "Device support depends on backend: NeMo accepts CPU execution, while TensorRT requires one GPU. Confirm the selected backend before changing device resources."
