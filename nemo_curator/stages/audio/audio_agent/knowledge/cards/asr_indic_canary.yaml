stage_id: InferenceIndicCanaryStage
category: transcribe
summary: "Indic Canary ASR through a prebuilt local TensorRT-LLM engine; requires the separate audio_canary_trtllm environment profile."
tags: [needs_gpu, needs_internet_first_run, batch_only]
model_id: null
domain: {language: "languages supported by the supplied engine", style: speech}
resource: {bound: gpu, gpu_optional: false}
use_cases:
  good_for: ["resident Indic speech using an existing compatible Canary engine"]
  avoid_for: ["running in a generic NeMo environment", "complete long-form transcription without prior segmentation"]
params_of_note:
  engine_dir: "Path to an existing TensorRT-LLM engine. The empty constructor default is not an executable configuration; supply a valid engine before setup."
  max_duration_sec: "Encoder window, default 40 seconds. Longer inputs can be truncated by the adapter; notes record truncation. Segment speech before this stage to retain complete coverage."
  min_duration_sec: "Adapter minimum input duration, default 0.5 seconds."
  max_audio_sec_per_actor: "Shared padded audio-seconds budget, default 2400; this does not replace the adapter's encoder window."
  keep_waveform: "False removes waveform after inference; enable it for a downstream audio consumer."
notes:
  - "Defaults read waveform and sampling_rate and write asr_prediction, asr_language, _skipme and additional_notes according to the result."
  - "Unsupported languages are marked skipped; existing skip reasons are retained."
  - "Requires a GPU and TensorRT-LLM loaded in the worker. It does not build or download an engine. The inherited first-run internet gate is conservative for local engines."
verified: {params: mechanical, tags: mechanical, domain: best_guess, resource: best_guess, use_cases: best_guess}
provenance: {model_card_url: null, card_version: 1, last_validated: "2026-10-06"}
