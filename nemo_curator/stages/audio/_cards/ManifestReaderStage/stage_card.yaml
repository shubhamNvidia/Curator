  top_level: []
  data: [audio_filepath]
produces_cardinality: '1:N'
params: []
resources: {cpus: 1.0, gpus: 0.0, gpu_memory_gb: 0.0}
batch_size: 1
supports_process_batch: false
preferred_executor: any
license: Apache-2.0
commercial_safe: true
cost_hint: very_cheap
tags: [reader, manifest, jsonl]
