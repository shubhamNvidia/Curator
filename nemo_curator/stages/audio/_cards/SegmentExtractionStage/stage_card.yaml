schema_version: '1.0'
name: SegmentExtractionStage
target: nemo_curator.stages.audio.io.extract_segments.SegmentExtractionStage
version: 1.0.0
public_api: true
description: |
  Slice the original audio file based on offset/duration in each task's
  manifest entry and write the slice as a standalone segment file (wav/flac/ogg)
  to output_dir. Operates batched; one source file is opened once per batch.
summary: Write per-segment audio files from manifest entries.
category: io
phase: materialize
input_shape: any
output_shape: write_files
terminal: false
capabilities: [segment_extract]
also_handles: []
inputs:
  top_level: []
  data: [original_file, original_start_ms, original_end_ms]
outputs:
  top_level: []
  data: [audio_filepath, extracted_path]
produces_cardinality: '1:1'
produces_on_disk_files: true
params:
  - {name: output_dir, type: path, required: true}
  - {name: output_format, type: enum, default: wav, choices: [wav, flac, ogg]}
resources: {cpus: 1.0, gpus: 0.0, gpu_memory_gb: 0.0}
batch_size: 64
supports_process_batch: true
preferred_executor: any
license: Apache-2.0
commercial_safe: true
cost_hint: cheap
tags: [io, extract, segment, wav]
selection_hints:
  prefer_when:
    - "the user wants per-clip audio files materialised on disk (intent.output_extract_clips is true)"
    - "the canonical row schema (`original_file`, `original_start_ms`, `original_end_ms`) is already present — i.e. `TimestampMapperStage` ran upstream"
  avoid_when:
    - "the manifest can ship without per-clip files (downstream training reads from the source file using offsets)"
  notes:
    - "Re-reads slices from `original_file` on disk; does NOT use the in-memory waveform — that has been dropped by `TimestampMapperStage`."
    - "Writes one file per row under `output_dir`. Names are derived from task_id + segment boundaries."
source_file: nemo_curator/stages/audio/io/extract_segments.py
smoke_test_status: unknown
