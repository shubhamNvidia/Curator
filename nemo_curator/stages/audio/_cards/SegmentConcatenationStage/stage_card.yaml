schema_version: '1.0'
name: SegmentConcatenationStage
target: nemo_curator.stages.audio.preprocessing.concatenation.SegmentConcatenationStage
version: 1.0.0
public_api: true
description: |
  Consume a single AudioTask whose task.data['segments'] holds a list of
  VAD-emitted nested segments. Concatenate them in order with silence_duration_sec
  of silence between each, and emit ONE AudioTask carrying the combined waveform
  plus segment_mappings in task._metadata.
summary: Concat nested VAD segments back into a single waveform with silence gaps.
category: preprocess
phase: concat
input_shape: nested_segments
output_shape: fan_in
terminal: false
capabilities: [segment_concat]
also_handles: []
inputs:
  top_level: []
  data: [segments]
outputs:
  top_level: []
  data: [waveform, sample_rate, num_segments, total_duration_sec, original_file]
produces_cardinality: '1:1'
produces_in_memory_waveform: true
params:
  - {name: silence_duration_sec, type: float, default: 0.5, min: 0.0, max: 5.0}
resources: {cpus: 1.0, gpus: 0.0, gpu_memory_gb: 0.0}
batch_size: 1
supports_process_batch: false
preferred_executor: any
license: Apache-2.0
commercial_safe: true
cost_hint: cheap
tags: [concat, vad, in_memory]
selection_hints:
  prefer_when:
    - "`VADSegmentationStage` ran upstream with `nested=true` AND a downstream stage needs `input_shape: whole_file` (e.g. `SpeakerSeparationStage`, `ALMDataBuilderStage`)"
    - "the next stage needs ONE coherent waveform per task"
  avoid_when:
    - "no segmentation has happened upstream — there is nothing to concatenate"
    - "VAD ran with `nested=false` (the default) — that produces fan-out across N tasks, and this stage CANNOT collapse fan-out. Re-run VAD with `nested=true` instead, or accept the fanned-out stream all the way to sink"
  notes:
    - "REQUIRES `task.data['segments']` (a list) to be present. This only exists when an upstream stage produced `output_shape: nested_segments` — today, only `VADSegmentationStage(nested=true)`."
    - "Cannot fan-in across fanned-out tasks. If you see `output_shape: fan_out_segments` upstream, this stage will not fix it."
    - "Records segment-to-time mapping in `task._metadata['segment_mappings']` so a later `TimestampMapperStage` can recover per-segment timestamps."
  ordering_hints:
    prefer_after:
      - vad   # we re-stitch what VAD segmented
    prefer_before:
      - speaker_separation   # SpeakerSeparation needs a single coherent waveform
      - alm_package           # ALM windows need full-clip audio
    rationale: |
      Bridge between VAD's segmentation and stages that need a whole-clip
      waveform. When VAD and SpeakerSeparation are both in a pipeline,
      this stage MUST sit between them.
source_file: nemo_curator/stages/audio/preprocessing/concatenation.py
smoke_test_status: unknown
