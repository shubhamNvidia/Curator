schema_version: '1.0'
name: SplitLongAudioStage
target: nemo_curator.stages.audio.tagging.split.SplitLongAudioStage
version: 1.0.0
public_api: true
description: |
  Split a very long audio file into approximately suggested_max_len chunks
  (writes new WAV files alongside the source); keeps the task 1:1 but stamps
  child-file metadata into task.data for downstream rejoin.
summary: Cut long recordings into ~max_len chunks for downstream batched processing.
category: tagging
phase: segment
input_shape: whole_file
output_shape: passthrough
terminal: false
capabilities: [long_audio_split]
also_handles: []
inputs:
  top_level: []
  data: [resampled_audio_filepath, audio_item_id]
outputs:
  top_level: []
  data: [split_filepaths, split_metadata, split_offsets, split_timestamps]
produces_cardinality: '1:1'
requires_on_disk_path: true
produces_on_disk_files: true
params:
  - {name: suggested_max_len, type: float, default: 3600.0, min: 1.0, max: 36000.0}
  - {name: min_len, type: float, default: 1.0, min: 0.0, max: 3600.0}
resources: {cpus: 1.0, gpus: 0.0, gpu_memory_gb: 0.0}
batch_size: 1
supports_process_batch: false
preferred_executor: any
license: Apache-2.0
commercial_safe: true
cost_hint: cheap
tags: [split, long_audio, on_disk]
selection_hints:
  prefer_when:
    - "the source corpus contains very long recordings (hours-long) that need chunking before ASR/diarization"
    - "downstream stages (ASR aligner, diarizer) cap their per-task duration"
  avoid_when:
    - "the source corpus is already short clips (< the suggested max_len)"
  notes:
    - "Operates on `resampled_audio_filepath` — pair with `ResampleAudioStage` upstream."
    - "Writes child WAV files alongside the resampled file; populates `split_filepaths`, `split_metadata`, `split_offsets`, `split_timestamps` in `task.data` so downstream stages (e.g. `JoinSplitAudioMetadataStage`) can stitch results back."
source_file: nemo_curator/stages/audio/tagging/split.py
smoke_test_status: unknown
