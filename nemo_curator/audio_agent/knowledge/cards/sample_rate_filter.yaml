stage_id: SampleRateFilterStage
category: preprocess
summary: "Record every row's sample rate and keep only acceptable ones (explicit list and/or min/max range). Reads the file header, never decodes, and never resamples."
tags: []
model_id: null
domain: {language: any, style: any}
constraints: {}
resource:
  cpus: 1.0
  gpu_mem_gb: 0.0
  gpu_optional: false
  bound: cpu
  throughput_hint: "CPU, header-only (soundfile.info) -- roughly 186x cheaper per file than decoding"
use_cases:
  good_for:
    - "excluding a corpus's off-rate rows before any decoding stage runs"
    - "annotating every row with its sample rate for reporting, with no constraint set"
    - "pairing with ChannelConversionStage when rate policy and channel policy should be set separately"
  avoid_for:
    - "changing the sample rate -- this stage only SELECTS; use ResampleAudioStage to convert"
    - "a corpus that must be made uniform (resample instead of discarding the minority rate)"
composition:
  typical_upstream: [ManifestReader, CreateInitialManifestReadSpeechStage, CreateInitialManifestAudioFolderStage]
  typical_downstream: [ChannelConversionStage, ResampleAudioStage, VADSegmentationStage, GetAudioDurationStage]
params_of_note:
  allowed_sample_rates: "explicit rates to keep, e.g. [16000, 22050]. None (default) = no constraint from this parameter."
  min_sample_rate: "lowest acceptable rate, inclusive. None (default) = unbounded below."
  max_sample_rate: "highest acceptable rate, inclusive. None (default) = unbounded above."
  sample_rate_key: "where the observed rate is written on EVERY row (including kept ones). Read from here first when an upstream stage already resolved it, which avoids touching disk at all."
semantic_facts:
  allowed_sample_rates:
    meaning: "The set of rates permitted through. Deliberately separate from min/max because a bare list like [16000, 48000] is ambiguous between 'these two rates' and 'this range', and the two readings filter very different corpora."
    unit: "Hz (list of integers)"
    propagation: "A row whose rate is not permitted is DROPPED (process returns []). Set both this and min/max to require both."
    gotchas:
      - "With nothing set the stage keeps every row and acts purely as an observer that records the rate."
      - "This stage never resamples: discarding the minority rate is not the same as making a corpus uniform. Use ResampleAudioStage for that."
      - "Place it BEFORE decoding stages -- it reads only the header, so rejected rows never get decoded."
  min_sample_rate:
    meaning: "Inclusive lower bound on the accepted rate."
    unit: "Hz (integer)"
    propagation: "Combined with max_sample_rate and allowed_sample_rates by AND: a rate must satisfy every constraint that is set."
relationships:
  ResampleAudioStage: "converts rates via ffmpeg. Use it when the corpus must become uniform rather than smaller."
  ChannelConversionStage: "brings audio to a requested channel count without touching the rate. Pairs with this stage when both policies matter."
  MonoConversionStage: "an alternative that gates on a single exact rate and converts channels together, decoding each file to do so. Use this stage instead for a set or range of rates, or to avoid decoding."
verified: {params: mechanical, semantic_facts: mechanical, tags: mechanical, resource: best_guess, use_cases: best_guess, domain: best_guess}
