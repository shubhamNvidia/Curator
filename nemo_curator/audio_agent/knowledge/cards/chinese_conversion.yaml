stage_id: ChineseConversionStage
category: text_norm
summary: "Convert Traditional Chinese to Simplified (or other OpenCC conversions), per segment."
tags: []
model_id: null
domain: {language: zh, style: any}
constraints: {}
resource:
  cpus: 1.0
  gpu_mem_gb: 0.0
  gpu_optional: false
  bound: cpu
  throughput_hint: "CPU; OpenCC text conversion"
use_cases:
  good_for: ["normalizing Chinese script variants (e.g. t2s) before training/eval"]
  avoid_for: ["non-Chinese text", "manifests with only a top-level `text` and no `segments` (rejected)"]
composition:
  typical_upstream: [InferenceAsrNemoStage, NeMoASRAlignerStage]
  typical_downstream: [ComputeWERStage, AudioToDocumentStage]
params_of_note:
  text_key: "the PER-SEGMENT text field to convert -- segments[].text (default text). NOT a top-level manifest key: this stage only reads/writes text inside each segment."
  convert_type: "OpenCC conversion type (e.g. 't2s', 's2t'); default t2s"
  output_suffix: "suffix for the written per-segment key (default _simplified)"
param_dependencies:
  text_key: "requires a `segments` list on each entry (operates on segments[].text) -- produce it upstream with VAD / ASR-align / diarization. A manifest with only a top-level `text` and no `segments` is rejected (missing required attributes: ['segments'])."
notes:
  - "Writes converted text to segments[].{text_key}{output_suffix}; keeps the original on conversion failure. Entries without a `segments` list are rejected (top-level `text` is ignored)."
verified: {params: mechanical, tags: mechanical, resource: best_guess, use_cases: best_guess, domain: best_guess}
provenance: {model_card_url: null, card_version: 2, last_validated: "2026-07-21"}
