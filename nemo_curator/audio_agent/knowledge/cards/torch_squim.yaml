stage_id: TorchSquimQualityMetricsStage
category: quality
summary: "Estimate PESQ / STOI / SI-SDR with the torchaudio SQUIM model; write to metrics."
tags: [produces_score, needs_internet_first_run]
model_id: "torchaudio SQUIM (objective)"
model_version: "torchaudio-SQUIM_OBJECTIVE"   # TODO(fill): pin torchaudio / SQUIM model version
domain: {language: any, style: speech}
constraints:
  supported_sample_rates: [16000]   # target_sr default 16000
resource:
  cpus: 1.0
  gpu_mem_gb: 0.4   # measured on RTX 4090 (~0.32 GB reserved for a single 6 s clip)
  gpu_optional: true
  bound: gpu
  throughput_hint: "batched inference; runs on GPU or CPU"
use_cases:
  good_for: ["reference-free objective quality (PESQ/STOI/SI-SDR proxies)"]
  avoid_for: ["non-speech audio"]
composition:
  typical_upstream: [MonoConversionStage, ResampleAudioStage, VADSegmentationStage]
  typical_downstream: [PreserveByValueStage, AudioToDocumentStage]
params_of_note:
  audio_filepath_key: "input audio path key (default resampled_audio_filepath)"
  target_sr: "sample rate fed to SQUIM (default 16000)"
  compute_batch_size: "audios per inference batch"
comparison:
  accuracy_hint: "objective PESQ/STOI/SI-SDR estimates (different family than MOS predictors UTMOS/SIGMOS)"
  latency_hint: "heavier than UTMOS; model inference"
  config_complexity: "low-medium"
  known_limitations: "speech-only; estimates, not reference measurements"
notes:
  - "Downloads the SQUIM model on first run. Writes results under metrics_key."
verified: {params: mechanical, tags: best_guess, model_version: best_guess, resource: best_guess, constraints: best_guess, domain: best_guess, use_cases: best_guess, comparison: best_guess}
provenance: {model_card_url: "https://pytorch.org/audio/stable/tutorials/squim_tutorial.html", card_version: 1, last_validated: "2026-07-20"}
