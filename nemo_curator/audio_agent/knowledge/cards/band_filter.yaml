stage_id: BandFilterStage
category: quality
summary: "Classify audio as full_band vs narrow_band (spectral RF) and filter/annotate."
tags: [produces_score, is_filter, needs_internet_first_run]
model_id: "nvidia/nemocurator-speech-bandwidth-filter (scikit-learn Random Forest)"
domain: {language: any, style: speech}
constraints:
  supported_sample_rates: [16000, 48000]
resource: {gpu_mem_gb: 0.0, throughput_hint: "CPU-only, cheap", gpu_optional: false}
use_cases:
  good_for: ["keep high-fidelity wideband recordings (full_band)", "cheap early cull before GPU quality stages"]
  avoid_for: ["telephony data you want to KEEP (then use band_value=narrow_band)"]
composition:
  typical_upstream: [MonoConversionStage, VADSegmentationStage]
  typical_downstream: [UTMOSFilterStage, SIGMOSFilterStage]
params_of_note:
  band_value: "'full_band' (keep hi-fi, default) or 'narrow_band' (keep telephony-style)"
notes:
  - "Cheapest quality filter (CPU) -- a good first filter to reduce load on downstream GPU stages."
provenance: {model_card_url: "https://huggingface.co/nvidia/nemocurator-speech-bandwidth-filter", card_version: 1, last_validated: "2026-07-12"}
