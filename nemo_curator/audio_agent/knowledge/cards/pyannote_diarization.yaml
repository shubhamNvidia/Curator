stage_id: PyAnnoteDiarizationStage
category: diarize
summary: "Speaker diarization + overlap detection with pyannote 3.1 (no fixed speaker cap; needs an HF token)."
tags: [needs_gpu, needs_internet_first_run, needs_hf_token, writes_disk]
model_id: "pyannote/speaker-diarization-3.1"
model_version: "pyannote/speaker-diarization-3.1"   # stage default model_name
domain: {language: any, style: conversational}   # pyannote is largely language-agnostic
constraints:
  input_duration_sweetspot_sec: {min: 0.5, max: 40.0}   # min_length / max_length defaults
resource:
  cpus: 1.0
  gpu_mem_gb: 0.2   # measured on RTX 4090 (~0.16 GB reserved, diarize forward on a 6 s clip)
  gpu_optional: true
  bound: gpu
  throughput_hint: "GPU recommended; batched segmentation + speaker embeddings"
use_cases:
  good_for:
    - "diarization WITH overlapping-speech detection (emits overlap_segments)"
    - "more than 4 speakers / no fixed speaker cap"
    - "non-English audio (largely language-agnostic)"
  avoid_for:
    - "environments without an accepted pyannote license / HF token"
    - "when a local no-token diarizer is required (use InferenceSortformerStage, <=4 speakers)"
composition:
  typical_upstream: [MonoConversionStage, ResampleAudioStage]
  typical_downstream: [MergeAlignmentDiarizationStage, TimestampMapperStage, AudioToDocumentStage]
params_of_note:
  hf_token: "HuggingFace token; REQUIRED (pyannote 3.1 is gated)"
  model_name: "the pyannote pipeline id (default pyannote/speaker-diarization-3.1)"
  min_length: "minimum segment length in s (default 0.5)"
  max_length: "maximum segment length in s (default 40); long turns are re-segmented via an internal VAD"
  segmentation_batch_size: "batch size for the segmentation model (default 128; VRAM/latency knob)"
  embedding_batch_size: "batch size for speaker embeddings (default 128)"
  write_rttm: "also write RTTM files beside the audio (default True)"
  fanout: "False (default) = passthrough with segments; True = one task per segment"
comparison:
  language_support: "language-agnostic. (external: pyannote model card)"
  accuracy_hint: "detects overlapping speech; no fixed speaker cap. DER approx AMI 12-14%, VoxConverse 9-11%, DIHARD III 17-19% (external, 'Full' setup)"
  config_complexity: "medium-high (needs token + license; onset/offset/batch knobs)"
  choose_when: "you need overlap detection, >4 speakers, or non-English, and can supply an HF token. Use InferenceSortformerStage for a local <=4-speaker English diarizer with no token."
  known_limitations: "requires an HF token and accepting TWO gated licenses; does NOT expose num_speakers/min_speakers/max_speakers, so the speaker count cannot be constrained through this card"
conflicts_with: [InferenceSortformerStage]   # alternative diarizer
notes:
  - "Emits BOTH `segments` and `overlap_segments`; downstream (MergeAlignmentDiarizationStage / TimestampMapperStage) should handle the overlap list too."
  - "Gated: you must accept BOTH pyannote/segmentation-3.0 AND pyannote/speaker-diarization-3.1 license terms on HuggingFace (missing the segmentation acceptance -> 401)."
  - "Internally loads a WhisperX/pyannote VAD (vad_onset=0.5, vad_offset=0.363) to re-segment long turns with randomized chunk sizes (non-deterministic unless seeded)."
  - "RTTM files are written beside the audio file (path not configurable) when write_rttm=True."
  - "Sample rate: pyannote ingests 16 kHz mono and auto-downmixes + auto-resamples on load, so any input rate is accepted (no supported_sample_rates constraint)."
  - "(external) pyannote 3.1 is pure PyTorch (3.1 removed onnxruntime)."
caveats:
  - "Requires a HuggingFace token and acceptance of the pyannote model license (two gated models)."
  - "Writes RTTM files to disk when write_rttm=True."
versions:   # verified in the Curator env (has onnxruntime) -- load + run + segments/overlap_segments structure (tested 2026-07-23, RTX 4090)
  "pyannote/speaker-diarization-3.1": "WHEN: overlap detection, >4 speakers, or non-English (with an HF token). Pure PyTorch (no onnxruntime needed); no fixed speaker cap. Stage default and the only pyannote version verified here."
verified: {params: mechanical, tags: best_guess, model_version: mechanical, resource: measured, constraints: best_guess, domain: best_guess, use_cases: best_guess, comparison: best_guess, versions: measured}
provenance: {model_card_url: "https://huggingface.co/pyannote/speaker-diarization-3.1", card_version: 2, last_validated: "2026-07-23"}
