# Capability card: model/semantic facts a stage's Python source cannot reveal.
stage_id: UTMOSFilterStage
category: quality
summary: "Predict UTMOS mean-opinion-score (MOS) and filter/annotate audio by quality."
tags: [produces_score, is_filter, needs_internet_first_run]
model_id: "tarepan/SpeechMOS:utmos22_strong (torch.hub)"
model_version: "utmos22_strong"   # torch.hub entrypoint pins the checkpoint
domain: {language: any, style: speech}
constraints:
  supported_sample_rates: [16000]   # audio is internally resampled to 16 kHz for inference
  input_duration_sweetspot_sec: {min: 1.0, max: 30.0}
resource:
  cpus: 1.0
  gpu_mem_gb: 1.5   # TODO(fill): measured value
  gpu_optional: true
  bound: gpu
  throughput_hint: "fast on GPU; CPU fallback is slower"
use_cases:
  good_for: ["gate speech clips by overall perceptual quality", "TTS/ASR data curation"]
  avoid_for: ["music or non-speech", "very short (<1s) clips"]
composition:
  typical_upstream: [MonoConversionStage, ResampleAudioStage, VADSegmentationStage]
  typical_downstream: [SIGMOSFilterStage, AudioToDocumentStage]
params_of_note:
  mos_threshold: "minimum MOS to keep (0-5). TTS: >=4.0; ASR/general: >=3.4; max retention: >=2.5"
  action: "'filter' drops below threshold; 'annotate' keeps all and only writes the score"
  mode: "'task' (whole file), 'segments' (per nested segment), or 'auto'"
metrics:
  utmos_mos:                                    # the score_key this stage writes
    scale: {min: 0.0, max: 5.0, direction: higher_better}
    threshold_param: mos_threshold              # this stage gates on the metric itself
    anchors:                                    # value range -> outcome label (best_guess)
      "4.0-5.0": studio                         # TTS-reference quality
      "3.4-4.0": general                        # ASR / general-purpose
      "2.5-3.4": lenient                        # maximum retention
    valid_range: [0.0, 5.0]
presets:
  tts_reference: {mos_threshold: 4.0}
  asr_finetune: {mos_threshold: 3.4}
  max_retention: {mos_threshold: 2.5}
comparison:
  accuracy_hint: "single overall MOS predictor; coarser than SIGMOS's 7 dimensions"
  latency_hint: "lighter than SIGMOS (one small model)"
  config_complexity: "low (one threshold)"
  known_limitations: "predictor of human MOS, not a ground-truth measurement; speech-only"
caveats:
  - "Downloads the model from torch.hub on first run (needs network once)."
  - "Score is a predictor of human MOS, not a ground-truth measurement."
verified: {params: mechanical, tags: mechanical, model_version: mechanical, resource: best_guess, constraints: best_guess, domain: best_guess, use_cases: best_guess, comparison: best_guess, metrics: best_guess}
provenance: {model_card_url: "https://github.com/tarepan/SpeechMOS", card_version: 2, last_validated: "2026-07-20"}
