stage_id: CreateInitialManifestAudioFolderStage
category: ingest
summary: "Create an initial manifest from any local folder of audio files (recursive scan, one AudioTask per file). Generic source -- no download, no transcripts."
tags: []
model_id: null
domain: {language: any, style: any}
constraints: {}
resource:
  cpus: 1.0
  gpu_mem_gb: 0.0
  gpu_optional: false
  bound: io
  throughput_hint: "CPU/IO; directory walk only, no audio decode"
use_cases:
  good_for:
    - "starting a pipeline from a plain local folder of WAV/FLAC/MP3/etc. with NO JSONL manifest (any dataset)"
    - "the generic alternative to CreateInitialManifestReadSpeechStage / CreateInitialManifestFleursStage when the data isn't one of those specific datasets"
  avoid_for:
    - "data that already has a JSONL manifest -- use ManifestReader"
    - "downloading a known public dataset -- use that dataset's CreateInitialManifest*Stage"
composition:
  typical_upstream: []
  typical_downstream: [GetAudioDurationStage, MonoConversionStage, ResampleAudioStage, VADSegmentationStage]
params_of_note:
  data_dir: "(REQUIRED, no default) local folder to scan for audio files"
  extensions: "audio file extensions to include (default: .wav/.flac/.mp3/.ogg/.opus/.m4a; case-insensitive)"
  recursive: "recurse into subfolders (default True)"
  max_samples: "cap the number of files (-1 = all, the default)"
param_dependencies:
  data_dir: "required: the stage scans this folder for audio files; there is no download step."
conflicts_with: [ManifestReader, CreateInitialManifestReadSpeechStage, CreateInitialManifestFleursStage]
notes:
  - "Generic, dataset-agnostic source. Emits one AudioTask per file with audio_filepath + a filename-derived audio_item_id; no transcripts (add an ASR stage if you need text)."
  - "References existing files on disk -- it does not download or write audio, so the card carries no writes_disk tag (see the tag<->gate conformance check)."
verified: {params: mechanical, tags: mechanical, resource: best_guess, use_cases: best_guess, domain: best_guess}
provenance: {model_card_url: null, card_version: 1, last_validated: "2026-07-26"}
