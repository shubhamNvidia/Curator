defaults:
  - _self_
  - override hydra/job_logging: none
  - override hydra/hydra_logging: none

hydra:
  run:
    dir: .
  output_subdir: null

raw_data_dir: ???
output_dir: ${raw_data_dir}/result

# 'batch' runs stages sequentially (works with any GPU/CPU count)
# 'streaming' runs stages concurrently (requires enough resources for all stages simultaneously)
execution_mode: batch

sample_rate: 48000
output_format: wav

enable_vad: true
vad_min_duration_sec: 2.0
vad_max_duration_sec: 60.0

enable_band_filter: true
band_value: full_band

enable_sigmos: true
sigmos_noise_threshold: 4.0
sigmos_ovrl_threshold: 3.5

enable_utmos: true
utmos_mos_threshold: 3.4

enable_speaker_separation: true
speaker_exclude_overlaps: true

# TimestampMapper always produces these fields:
#   original_file, original_start_ms, original_end_ms, duration_ms, duration_sec
#
# passthrough_keys controls which additional metadata appears in the output.
# When null, all non-internal keys pass through (sample_rate, is_mono, num_segments, etc.)
# When set to a list, only the specified keys are included.
#
# Available keys by stage:
#   BandFilter:  band_prediction
#   UTMOS:       utmos_mos
#   SIGMOS:      sigmos_noise, sigmos_ovrl, sigmos_sig, sigmos_col, sigmos_disc, sigmos_loud, sigmos_reverb
#   SpeakerSep:  speaker_id, num_speakers (only when enable_speaker_separation=true)

passthrough_keys:
  - band_prediction
  - utmos_mos
  - sigmos_noise
  - sigmos_ovrl
  - speaker_id
  - num_speakers

processors:

  - _target_: nemo_curator.stages.audio.AudioDataFilterStage
    config:
      mono_conversion:
        output_sample_rate: ${sample_rate}
      vad:
        enable: ${enable_vad}
        min_duration_sec: ${vad_min_duration_sec}
        max_duration_sec: ${vad_max_duration_sec}
      band_filter:
        enable: ${enable_band_filter}
        band_value: ${band_value}
      sigmos:
        enable: ${enable_sigmos}
        noise_threshold: ${sigmos_noise_threshold}
        ovrl_threshold: ${sigmos_ovrl_threshold}
      utmos:
        enable: ${enable_utmos}
        mos_threshold: ${utmos_mos_threshold}
      speaker_separation:
        enable: ${enable_speaker_separation}
        exclude_overlaps: ${speaker_exclude_overlaps}
      timestamp_mapper:
        passthrough_keys: ${passthrough_keys}

  - _target_: nemo_curator.stages.audio.io.convert.AudioToDocumentStage

  - _target_: nemo_curator.stages.text.io.writer.JsonlWriter
    path: ${output_dir}
    write_kwargs:
      force_ascii: false
