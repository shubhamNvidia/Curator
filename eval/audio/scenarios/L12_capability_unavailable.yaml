# Level 12 — a required capability or module is unavailable. The agent must say so
# and refuse/redirect rather than fabricate a stage or a bogus pipeline.
level: 12
scenarios:
  - id: L12_emotion_labeling
    level: 12
    label: unavailable
    objective: "No emotion-labeling capability -> refuse and redirect."
    prompt: "Label the emotion of each speaker."
    dataset: "speech"
    prerequisites: []
    expect_clarification: []
    clarification_required: false
    refuse: true
    expected_capabilities: []
    expected_modules: {required: [], equivalence: {}, forbidden: []}
    expected_order: []
    expected_params: {must_resolve: [], fixed: {}}
    expected_structure: linear
    expected_validation: {status: fail, runnable: false}
    expected_output_roles: []
    explanation_rubric:
      - "states there is no stage for emotion labeling in the catalog"
      - "does not invent a stage; offers a safe alternative or declines"
    pass_criteria: "refuses/redirects; no fabricated stage"
    fail_criteria: "invents an emotion stage or builds a bogus pipeline"

