# Audio-agent eval harness — seed NL queries (P1).
#
# The planner is host-driven, so this harness asserts on the DETERMINISTIC oracle
# the host relies on (validity of the gold recipe, unproducible roles, and
# capability coverage) rather than on an LLM. Each query carries a gold recipe
# (a library `recipe_ref` or an inline `recipe`) plus `expect`:
#   validate_ok: bool        -> aa.validate(recipe).ok must equal this
#   runnable: bool           -> aa.validate(recipe).runnable must equal this
#   has_code: str            -> a validate issue with this code must be present
#   unproducible_role: str   -> the role must be unproducible in the catalog
#   no_stage_for: [words]    -> discover must contain no stage matching these words
#                               (deterministic proxy for "the agent must refuse/redirect")
#
# Categories: core (happy path), extended (more shapes), negative/guarded.

queries:
  - id: clean_speech_quality
    label: core
    prompt: "I have a folder of WAVs, give me cleaner speech data (I don't know which checks to use)."
    recipe_ref: readspeech_quality
    expect: {validate_ok: true, runnable: true}

  - id: asr_wer_filter
    label: core
    prompt: "Transcribe FLEURS and drop rows with high WER."
    recipe_ref: fleurs_asr_filter
    expect: {validate_ok: true, runnable: true}

  - id: alm_windows
    label: core
    prompt: "Build audio-language-model training windows from my diarized manifest."
    recipe_ref: alm_windowing
    expect: {validate_ok: true, runnable: true}

  - id: annotate_duration
    label: extended
    prompt: "Add audio duration to each row of my manifest and export JSONL."
    recipe:
      stages:
        - {ref: ManifestReader, params: {manifest_path: "REQUIRED"}}
        - {ref: GetAudioDurationStage, params: {}}
        - {ref: AudioToDocumentStage, params: {}}
    expect: {validate_ok: true, runnable: true}

  - id: vad_then_quality
    label: extended
    prompt: "Split my audio into speech segments and score each segment's quality."
    recipe:
      stages:
        - {ref: ManifestReader, params: {manifest_path: "REQUIRED"}}
        - {ref: VADSegmentationStage, params: {nested: false}}
        - {ref: UTMOSFilterStage, params: {mos_threshold: 3.0, input_residency: "waveform", action: "annotate"}}
        - {ref: AudioToDocumentStage, params: {}}
    expect: {validate_ok: true, runnable: true}

  - id: mono_resample
    label: extended
    prompt: "Convert my stereo audio to mono at 16 kHz."
    recipe:
      stages:
        - {ref: ManifestReader, params: {manifest_path: "REQUIRED"}}
        - {ref: MonoConversionStage, params: {output_sample_rate: 16000}}
        - {ref: AudioToDocumentStage, params: {}}
    expect: {validate_ok: true, runnable: true}

  - id: diarize_speakers
    label: extended
    prompt: "Diarize my meeting recordings (who spoke when)."
    recipe:
      stages:
        - {ref: ManifestReader, params: {manifest_path: "REQUIRED"}}
        - {ref: InferenceSortformerStage, params: {model_name: "nvidia/diar_sortformer_4spk-v1"}}
        - {ref: AudioToDocumentStage, params: {}}
    expect: {validate_ok: true}

  - id: unknown_stage
    label: negative
    prompt: "Denoise my audio with the MagicDenoiser stage."
    recipe:
      stages:
        - {ref: MagicDenoiserStage, params: {}}
    expect: {validate_ok: false, has_code: unknown_stage}

  - id: wer_needs_transcripts
    label: guarded
    prompt: "Compute WER, but my manifest has no reference transcripts."
    expect: {unproducible_role: reference_text}

  - id: refuse_emotion_labeling
    label: negative
    prompt: "Label the emotion and accent of each speaker."
    expect: {no_stage_for: [emotion, accent]}

  # --- 1.1 correctness-registry checks (task-type / key-flow / output-completeness) ---
  - id: task_type_mismatch
    label: negative
    prompt: "Aggregate to a DocumentBatch, then run an AudioTask stage on it (wrong order)."
    recipe:
      stages:
        - {ref: ManifestReader, params: {manifest_path: "REQUIRED"}}
        - {ref: AudioToDocumentStage, params: {}}
        - {ref: GetAudioDurationStage, params: {}}
    expect: {runnable: false, status: fail, has_code: task_type_mismatch}

  - id: key_removed_upstream
    label: negative
    prompt: "Nested VAD drops the top-level waveform, then transcribe from that waveform."
    recipe:
      stages:
        - {ref: MonoConversionStage, params: {}}
        - {ref: VADSegmentationStage, params: {nested: true}}
        - {ref: InferenceAsrNemoStage, params: {model_name: "stt_en_conformer", input_residency: "waveform"}}
    expect: {runnable: false, has_code: key_removed_upstream}

  - id: missing_output_transcripts
    label: negative
    prompt: "I want transcripts, but the recipe has no ASR stage."
    recipe:
      stages:
        - {ref: ManifestReader, params: {manifest_path: "REQUIRED"}}
        - {ref: GetAudioDurationStage, params: {}}
        - {ref: AudioToDocumentStage, params: {}}
    expected_outputs: [pred_text]
    expect: {has_code: missing_output_producer}

  # --- 1A.1 acceptance layer (request-type sanity / criteria compilation / verify) ---
  - id: acceptance_missing_yield
    label: negative
    prompt: "Keep only the clean clips (a filtering request) but no yield criterion is defined."
    request_type: filter
    recipe:
      stages:
        - {ref: ManifestReader, params: {manifest_path: "REQUIRED"}}
        - {ref: UTMOSFilterStage, params: {mos_threshold: 4.0}}
        - {ref: AudioToDocumentStage, params: {}}
    acceptance_criteria:
      - {id: quality, type: quality_standard, kind: absolute, severity: must, check: {scope: aggregate, field: utmos_mos, op: ">=", value: 4.0}}
    expect: {has_code: missing_implied_criterion}

  - id: acceptance_criteria_output_gap
    label: negative
    prompt: "Success requires transcripts (pred_text) but the recipe has no ASR stage."
    request_type: transcribe
    recipe:
      stages:
        - {ref: ManifestReader, params: {manifest_path: "REQUIRED"}}
        - {ref: GetAudioDurationStage, params: {}}
        - {ref: AudioToDocumentStage, params: {}}
    acceptance_criteria:
      - {id: has_transcripts, type: output_completeness, compiles_to: pred_text, severity: must}
    expect: {runnable: false, has_code: missing_output_producer}

  - id: acceptance_verify_met
    label: verify
    prompt: "Verify: quality>=4.0 met and yield>0 met -> overall met."
    acceptance_criteria:
      - {id: quality, type: quality_standard, kind: absolute, severity: must, check: {scope: aggregate, field: utmos_mos, op: ">=", value: 4.0}}
      - {id: kept, type: yield, kind: absolute, severity: must, check: {op: ">", value: 0}}
    verify_evidence: {metrics: {utmos_mos: 4.3}, retained: 42, input_count: 100}
    expect: {acceptance_overall: met}

  - id: acceptance_verify_not_met
    label: verify
    prompt: "Verify: absolute must bar not met on this data -> overall not_met (no goalpost-moving)."
    acceptance_criteria:
      - {id: quality, type: quality_standard, kind: absolute, severity: must, check: {scope: aggregate, field: utmos_mos, op: ">=", value: 4.5}}
    verify_evidence: {metrics: {utmos_mos: 3.1}, retained: 0, input_count: 100}
    expect: {acceptance_overall: not_met, criterion_status: {quality: not_met}}

  - id: acceptance_verify_unverifiable
    label: verify
    prompt: "Verify: accuracy criterion with no evidence -> unverifiable, not a silent pass."
    acceptance_criteria:
      - {id: accuracy, type: quality_standard, kind: absolute, severity: nice, check: {scope: aggregate, field: wer, op: "<=", value: 10}}
      - {id: semantic, type: semantic_fit, severity: nice, check: {method: reviewer_judgment}}
    verify_evidence: {retained: 10, input_count: 10}
    expect: {acceptance_overall: met, criterion_status: {accuracy: unverifiable, semantic: unverifiable}}

  # --- 1A.2 config-strategy resolver (outcome label/preset -> concrete param) ---
  - id: resolve_studio_utmos
    label: resolve
    prompt: "Studio quality -> UTMOS threshold, without exposing the number to the user."
    resolve: {stage: UTMOSFilterStage, label: studio}
    expect: {resolve_params: {mos_threshold: 4.0}}

  - id: resolve_preset_utmos
    label: resolve
    prompt: "TTS-reference preset -> the card's bundled threshold."
    resolve: {stage: UTMOSFilterStage, use_case: tts_reference}
    expect: {resolve_params: {mos_threshold: 4.0}}

  - id: resolve_categorical_band
    label: resolve
    prompt: "Wideband outcome -> band_value (categorical anchor)."
    resolve: {stage: BandFilterStage, label: wideband}
    expect: {resolve_params: {band_value: full_band}}

  - id: resolve_annotator_wer
    label: resolve
    prompt: "Transcription-grade WER -> a PreserveByValue filter (annotator, no self-threshold)."
    resolve: {stage: GetPairwiseWerStage, label: transcription_grade}
    expect: {resolve_filter_ref: PreserveByValueStage}

  - id: resolve_unknown_label
    label: resolve
    prompt: "An unknown outcome label -> the resolver asks instead of guessing."
    resolve: {stage: UTMOSFilterStage, label: bogus}
    expect: {resolve_ask: true}

  # --- 1A.3 honesty guard (anti-goalpost-moving) ---
  - id: honesty_goalpost_moving
    label: verify
    prompt: "Confirmed UTMOS>=4.0, but verify against a silently relaxed 3.0 bar -> blocked."
    frozen_criteria:
      - {id: quality, type: quality_standard, kind: absolute, severity: must, check: {field: utmos_mos, op: ">=", value: 4.0}}
    acceptance_criteria:
      - {id: quality, type: quality_standard, kind: absolute, severity: must, check: {field: utmos_mos, op: ">=", value: 3.0}}
    verify_evidence: {metrics: {utmos_mos: 3.2}, retained: 8, input_count: 10}
    expect: {acceptance_overall: not_met, honesty_code: must_relaxed}

  - id: honesty_dropped_must
    label: verify
    prompt: "Confirmed a must-criterion, but verify omits it -> blocked as dropped."
    frozen_criteria:
      - {id: quality, type: quality_standard, kind: absolute, severity: must, check: {field: utmos_mos, op: ">=", value: 4.0}}
    acceptance_criteria: []
    verify_evidence: {retained: 10, input_count: 10}
    expect: {acceptance_overall: not_met, honesty_code: must_dropped}

  - id: honesty_clean
    label: verify
    prompt: "Verify honors the confirmed contract and evidence meets it -> met, no honesty flags."
    frozen_criteria:
      - {id: quality, type: quality_standard, kind: absolute, severity: must, check: {field: utmos_mos, op: ">=", value: 4.0}}
    acceptance_criteria:
      - {id: quality, type: quality_standard, kind: absolute, severity: must, check: {field: utmos_mos, op: ">=", value: 4.0}}
    verify_evidence: {metrics: {utmos_mos: 4.3}, retained: 5, input_count: 10}
    expect: {acceptance_overall: met, honesty_flagged: false}

  # --- incremental continuation (Run Records): reuse prior work for a follow-up ---
  - id: continuation_extend
    label: continuation
    prompt: "Curated with mono+UTMOS; follow-up 'also add transcripts' -> reuse, run only ASR."
    continuation:
      parent:
        run_id: run-parent
        data_fingerprint: fp1
        output_paths: [curated.jsonl]
        recipe:
          stages:
            - {ref: MonoConversionStage, params: {}}
            - {ref: UTMOSFilterStage, params: {mos_threshold: 4.0}}
      recipe:
        stages:
          - {ref: MonoConversionStage, params: {}}
          - {ref: UTMOSFilterStage, params: {mos_threshold: 4.0}}
          - {ref: InferenceAsrNemoStage, params: {model_name: x}}
      data_fingerprint: fp1
    expect: {mode: incremental, run_stages: [InferenceAsrNemoStage]}

  - id: continuation_param_change
    label: continuation
    prompt: "Follow-up changes an upstream threshold -> full rerun (no reusable intermediate)."
    continuation:
      parent:
        run_id: run-parent
        data_fingerprint: fp1
        recipe:
          stages:
            - {ref: MonoConversionStage, params: {}}
            - {ref: UTMOSFilterStage, params: {mos_threshold: 4.0}}
      recipe:
        stages:
          - {ref: MonoConversionStage, params: {}}
          - {ref: UTMOSFilterStage, params: {mos_threshold: 3.0}}
      data_fingerprint: fp1
    expect: {mode: full_rerun}

  - id: continuation_data_changed
    label: continuation
    prompt: "Same recipe extension but a DIFFERENT dataset -> full rerun (fingerprint mismatch)."
    continuation:
      parent:
        run_id: run-parent
        data_fingerprint: fp1
        recipe:
          stages:
            - {ref: MonoConversionStage, params: {}}
      recipe:
        stages:
          - {ref: MonoConversionStage, params: {}}
          - {ref: UTMOSFilterStage, params: {mos_threshold: 4.0}}
      data_fingerprint: fp2
    expect: {mode: full_rerun}

  # --- 1C.2 resource calibration (measured resources refine the plan) ---
  - id: calibrate_extract
    label: calibrate
    prompt: "Extract measured VRAM from a smoke report's per-stage metrics."
    calibrate_smoke:
      per_stage_metrics:
        UTMOSFilter: {peak_vram_gb: {sum: 3.4, mean: 3.4, count: 1}}   # stage.name, as a real smoke keys it
        MonoConversion: {cpu_time: {sum: 0.2, mean: 0.2, count: 1}}
    expect: {calibration: {UTMOSFilter: {gpu_mem_gb: 3.4}}}

  - id: calibrate_planner_prefers
    label: calibrate
    prompt: "The planner uses measured VRAM (3.4) over the card best_guess (1.5)."
    calibrate_plan:
      stage: UTMOSFilterStage
      params: {mos_threshold: 4.0}
      env: {has_gpu: true, gpu_count: 1, gpu_mem_gb: 16.0, total_cpus: 8, total_ram_gb: 32.0}
      calibration: {UTMOSFilter: {gpu_mem_gb: 3.4, source: measured}}   # keyed by stage.name (from a real smoke)
    expect: {expect_gpu_mem_gb: 3.4, expect_source: measured}

  - id: calibrate_infeasible
    label: calibrate
    prompt: "Measured VRAM that exceeds the GPU flips feasibility to infeasible."
    calibrate_plan:
      stage: UTMOSFilterStage
      params: {mos_threshold: 4.0}
      env: {has_gpu: true, gpu_count: 1, gpu_mem_gb: 4.0, total_cpus: 8, total_ram_gb: 32.0}
      calibration: {UTMOSFilter: {gpu_mem_gb: 40.0, source: measured}}   # keyed by stage.name
    expect: {expect_feasible: false}
